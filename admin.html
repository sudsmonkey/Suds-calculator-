<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suds Monkey — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F56E64;
    --dark:   #A6382E;
    --mint:   #9ED9C0;
    --dark-mint: #3A8C6A;
    --cream:  #FDF9F5;
    --light:  #F6ECDE;
    --ink:    #3d3530;
    --mid:    #7C7268;
    --border: #E8DDD6;
    --white:  #FFFFFF;
    --radius: 16px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); min-height: 100vh; color: var(--ink); }

  /* ── Dashboard shell ── */
  #adminDash { display: none; }

  .top-bar {
    background: var(--orange);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-bar-title { color: #fff; font-size: 17px; font-weight: 900; }
  .top-bar-sub { color: rgba(255,255,255,0.8); font-size: 12px; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    border-bottom: 1.5px solid var(--border);
    background: var(--white);
  }
  .tab {
    flex: 1;
    padding: 14px 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 900;
    color: var(--mid);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }

  /* ── Panel ── */
  .panel { display: none; padding: 20px 16px 40px; max-width: 520px; margin: 0 auto; }
  .panel.active { display: block; }

  .section-label {
    font-size: 11px; font-weight: 900; color: var(--mid);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 10px; margin-top: 24px;
  }
  .section-label:first-child { margin-top: 0; }

  /* ── Mini calendar (block panel) ── */
  .cal-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .month-nav button {
    background: none; border: none; cursor: pointer;
    color: var(--orange); font-size: 20px; font-weight: 900;
    padding: 4px 10px; border-radius: 8px; line-height: 1;
  }
  .month-nav button:hover { background: #FDF0EF; }
  .month-name { font-size: 16px; font-weight: 900; color: var(--dark); }
  .day-headers { display: grid; grid-template-columns: repeat(7,1fr); padding: 8px 12px 4px; }
  .day-header { text-align: center; font-size: 10px; font-weight: 700; color: var(--mid); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; padding: 4px 12px 14px; }
  .cal-day {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; color: var(--dark); position: relative;
  }
  .cal-day:hover:not(.disabled):not(.empty) { background: #FDF0EF; }
  .cal-day.empty, .cal-day.disabled { cursor: default; }
  .cal-day.disabled { color: #DDD3C4; }
  .cal-day.selected { background: var(--orange) !important; color: #fff; }
  .cal-day.today { border: 2px solid var(--mint); }
  .cal-day.has-block::after {
    content: ''; display: block;
    width: 4px; height: 4px;
    background: var(--dark);
    border-radius: 50%; position: absolute; bottom: 2px;
  }

  /* ── Slot buttons ── */
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot-btn {
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--white);
  }
  .slot-btn.available { border-color: var(--mint); background: rgba(158,217,192,0.08); }
  .slot-btn.available .slot-status { color: var(--dark-mint); }
  .slot-btn.booked-customer { border-color: #DDD3C4; background: #F5EDE4; cursor: not-allowed; }
  .slot-btn.booked-customer .slot-status { color: var(--mid); }
  .slot-btn.blocked-admin { border-color: var(--orange); background: rgba(245,110,100,0.07); }
  .slot-btn.blocked-admin .slot-status { color: var(--dark); }
  .slot-time { font-size: 16px; font-weight: 900; color: var(--ink); margin-bottom: 4px; }
  .slot-status { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .slot-action { font-size: 11px; color: var(--mid); margin-top: 6px; }

  /* ── Booking cards ── */
  .booking-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .booking-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .booking-name { font-size: 16px; font-weight: 900; color: var(--dark); }
  .booking-date-badge {
    background: var(--orange);
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 50px;
    white-space: nowrap;
  }
  .booking-row { display: flex; gap: 8px; font-size: 13px; color: var(--mid); margin-bottom: 4px; }
  .booking-row strong { color: var(--ink); font-weight: 700; }
  .booking-package {
    display: inline-block;
    background: var(--light);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--dark);
    margin-top: 6px;
  }
  .booking-total {
    font-size: 15px;
    font-weight: 900;
    color: var(--orange);
    margin-top: 6px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--mid);
    font-size: 14px;
    font-weight: 700;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .filter-btn {
    border: 1.5px solid var(--border);
    background: var(--white);
    border-radius: 50px;
    padding: 6px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--mid);
    cursor: pointer;
  }
  .filter-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }

  .spinner {
    text-align: center;
    padding: 32px;
    color: var(--mid);
    font-size: 13px;
    font-weight: 700;
  }

  #fullDayBtn {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 900;
    border-radius: 50px;
    padding: 6px 14px;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }
  #fullDayBtn:hover { opacity: 0.85; }
  #fullDayBtn.block-all   { background: var(--orange); color: #fff; }
  #fullDayBtn.unblock-all { background: var(--light);  color: var(--dark); border: 1.5px solid var(--border); }

  /* ── Reviews panel ── */
  .field-row { margin-bottom: 14px; }
  .field-row label { display: block; font-size: 12px; font-weight: 700; color: var(--mid); margin-bottom: 5px; }
  .field-row input[type=text], .field-row textarea, .field-row select {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-family: 'Nunito', sans-serif; font-size: 14px;
    color: var(--ink); background: var(--white);
  }
  .field-row textarea { resize: vertical; min-height: 64px; }
  .field-inline { display: flex; gap: 8px; }
  .field-inline > * { flex: 1; }
  .btn {
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900;
    border-radius: 50px; padding: 10px 18px; cursor: pointer; border: none;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-secondary { background: var(--light); color: var(--dark); border: 1.5px solid var(--border); }
  .find-place-link { display: inline-block; font-size: 12px; color: var(--orange); font-weight: 700; margin-top: 8px; text-decoration: none; }
  .find-place-link:hover { text-decoration: underline; }
  .status-msg { font-size: 12px; font-weight: 700; margin-top: 8px; }
  .status-msg.ok { color: var(--dark-mint); }
  .status-msg.err { color: var(--dark); }
  .review-card { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .review-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .review-stars { color: var(--orange); font-size: 14px; letter-spacing: 1px; }
  .review-src { font-size: 10px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); }
  .review-text { font-size: 13px; color: var(--ink); line-height: 1.55; font-style: italic; margin-bottom: 8px; }
  .review-author { font-size: 12px; font-weight: 900; color: var(--dark); }
  .review-time { font-size: 11px; color: var(--mid); margin-bottom: 10px; }
  .review-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .review-feature-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .review-feature-toggle input { width: 16px; height: 16px; accent-color: var(--orange); }
  .review-bucket-select { font-size: 12px; padding: 5px 8px; border-radius: 8px; border: 1.5px solid var(--border); font-family: 'Nunito', sans-serif; }
  .review-remove { font-size: 11px; color: var(--mid); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: 'Nunito', sans-serif; }
  #codeOutput { width: 100%; min-height: 260px; font-family: 'Menlo','Consolas',monospace; font-size: 11px; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; color: var(--ink); }
</style>
</head>
<body>

<!-- ─────────── Admin dashboard ─────────── -->
<div id="adminDash">
  <div class="top-bar">
    <div>
      <div class="top-bar-title">Suds Monkey Admin</div>
      <div class="top-bar-sub" id="todayLabel"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('block')">Block Slots</div>
    <div class="tab" onclick="switchTab('bookings')">Bookings</div>
    <div class="tab" onclick="switchTab('consults')">Consults</div>
    <div class="tab" onclick="switchTab('reviews')">Reviews</div>
  </div>

  <!-- Block Slots panel -->
  <div class="panel active" id="panelBlock">
    <div class="section-label">Pick a date</div>
    <div class="cal-card">
      <div class="month-nav">
        <button onclick="adminPrevMonth()">‹</button>
        <span class="month-name" id="adminMonthName"></span>
        <button onclick="adminNextMonth()">›</button>
      </div>
      <div class="day-headers">
        <div class="day-header">Su</div><div class="day-header">Mo</div>
        <div class="day-header">Tu</div><div class="day-header">We</div>
        <div class="day-header">Th</div><div class="day-header">Fr</div>
        <div class="day-header">Sa</div>
      </div>
      <div class="cal-grid" id="adminCalGrid"></div>
    </div>

    <div id="slotSection" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; margin-top:24px;">
        <div class="section-label" id="slotSectionLabel" style="margin:0;">Time slots</div>
        <button id="fullDayBtn" style="display:none;"></button>
      </div>
      <div class="slot-grid" id="slotGrid"></div>
    </div>
  </div>

  <!-- Bookings panel -->
  <div class="panel" id="panelBookings">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('upcoming', this)">Upcoming</button>
      <button class="filter-btn" onclick="setFilter('all', this)">All</button>
    </div>
    <div id="bookingsList"></div>
  </div>

  <!-- Consults panel -->
  <div class="panel" id="panelConsults">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setConsultFilter('upcoming', this)">Upcoming</button>
      <button class="filter-btn" onclick="setConsultFilter('all', this)">All</button>
    </div>
    <div id="consultsList"></div>
  </div>

  <!-- Reviews panel -->
  <div class="panel" id="panelReviews">
    <div class="section-label">Pull from Google</div>
    <div class="field-row">
      <label for="placeIdInput">Google Place ID</label>
      <input type="text" id="placeIdInput" placeholder="ChIJ...">
      <a class="find-place-link" href="https://developers.google.com/maps/documentation/places/web-service/place-id" target="_blank" rel="noopener">Find your Place ID →</a>
    </div>
    <button class="btn btn-primary" id="fetchReviewsBtn" onclick="fetchGoogleReviews()">Fetch Reviews from Google</button>
    <div class="status-msg" id="fetchStatus"></div>
    <div class="status-msg ok" id="aggStatus" style="margin-top:4px;"></div>

    <div class="section-label">Add a review manually</div>
    <div class="field-row field-inline">
      <div>
        <label for="manRating">Rating</label>
        <select id="manRating">
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★ (4)</option>
          <option value="3">★★★ (3)</option>
          <option value="2">★★ (2)</option>
          <option value="1">★ (1)</option>
        </select>
      </div>
      <div>
        <label for="manBucket">Show under</label>
        <select id="manBucket">
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <label for="manAuthor">Author name (as shown on Google)</label>
      <input type="text" id="manAuthor" placeholder="Jane Smith">
    </div>
    <div class="field-row">
      <label for="manText">Review text</label>
      <textarea id="manText" placeholder="Paste the real review text here..."></textarea>
    </div>
    <button class="btn btn-secondary" onclick="addManualReview()">Add Review</button>

    <div class="section-label">Reviews (check to feature on site)</div>
    <div id="reviewsList"></div>

    <div class="section-label">Generate code</div>
    <button class="btn btn-primary" onclick="generateReviewCode()">Generate HTML + Schema Markup</button>
    <button class="btn btn-secondary" id="copyCodeBtn" onclick="copyReviewCode()" style="display:none; margin-left:8px;">Copy to Clipboard</button>
    <textarea id="codeOutput" readonly style="display:none;"></textarea>
  </div>
</div>

<div id="placesDummy" style="display:none;"></div>

<script>
  // ── Config ──────────────────────────────
  const SUPABASE_URL   = 'https://ykjkcegpwiqhpfcgkwro.supabase.co';
  const SUPABASE_KEY   = 'sb_publishable_wVwjixnqqbFjjJqH7f9nhA_qHGpE4md';
  const SLOTS          = ['8:00 AM', '1:00 PM'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  // ── Startup ─────────────────────────────
  // The password gate has been removed, so the dashboard opens straight away.
  function init() {
    showDash();
  }

  function showDash() {
    document.getElementById('adminDash').style.display = 'block';
    const now = new Date();
    document.getElementById('todayLabel').textContent =
      MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
    renderAdminCal();
    loadBookings();
  }

  // ── Tabs ────────────────────────────────
  const PANEL_MAP = { block: 'panelBlock', bookings: 'panelBookings', consults: 'panelConsults', reviews: 'panelReviews' };

  function switchTab(name) {
    const tabNames = ['block', 'bookings', 'consults', 'reviews'];
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', tabNames[i] === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(PANEL_MAP[name]).classList.add('active');
    if (name === 'bookings') loadBookings();
    if (name === 'consults') loadConsults();
    if (name === 'reviews') initReviewsPanel();
  }

  // ── Admin calendar ───────────────────────
  const adminToday = new Date();
  adminToday.setHours(0,0,0,0);
  let adminYear  = adminToday.getFullYear();
  let adminMonth = adminToday.getMonth();
  let adminSelectedDate = null;
  let adminTakenSlots = {};

  function renderAdminCal() {
    const grid = document.getElementById('adminCalGrid');
    grid.innerHTML = '';
    document.getElementById('adminMonthName').textContent = MONTHS[adminMonth] + ' ' + adminYear;

    const firstDay  = new Date(adminYear, adminMonth, 1).getDay();
    const totalDays = new Date(adminYear, adminMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(adminYear, adminMonth, d);
      date.setHours(0,0,0,0);
      const dateStr = adminYear + '-' + String(adminMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const isPast = date < adminToday;
      const el = document.createElement('div');

      el.className = 'cal-day' + (isPast ? ' disabled' : '');
      if (!isPast) el.onclick = () => adminSelectDate(dateStr);
      if (date.getTime() === adminToday.getTime()) el.classList.add('today');
      if (dateStr === adminSelectedDate) el.classList.add('selected');
      el.textContent = d;
      grid.appendChild(el);
    }
  }

  function adminPrevMonth() {
    adminMonth--;
    if (adminMonth < 0) { adminMonth = 11; adminYear--; }
    renderAdminCal();
  }
  function adminNextMonth() {
    adminMonth++;
    if (adminMonth > 11) { adminMonth = 0; adminYear++; }
    renderAdminCal();
  }

  async function adminSelectDate(dateStr) {
    adminSelectedDate = dateStr;
    renderAdminCal();

    const slotSec = document.getElementById('slotSection');
    slotSec.style.display = 'block';
    const parts = dateStr.split('-');
    const label = MONTHS[parseInt(parts[1])-1] + ' ' + parseInt(parts[2]) + ', ' + parts[0];
    document.getElementById('slotSectionLabel').textContent = label;

    const grid = document.getElementById('slotGrid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--mid);font-size:13px;font-weight:700;">Loading…</div>';

    try {
      const [bRes, blRes] = await Promise.all([
        fetch(SUPABASE_URL + '/rest/v1/bookings?select=time&date_iso=eq.' + dateStr, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        }),
        fetch(SUPABASE_URL + '/rest/v1/blocked_slots?select=id,time&date=eq.' + dateStr, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        })
      ]);
      const booked  = bRes.ok  ? await bRes.json() : [];
      const blocked = blRes.ok ? await blRes.json() : [];

      adminTakenSlots[dateStr] = {
        customer: new Set(booked.map(r => r.time)),
        admin:    Object.fromEntries(blocked.map(r => [r.time, r.id]))
      };
    } catch(e) {
      console.warn('Failed to load slot data:', e);
      adminTakenSlots[dateStr] = { customer: new Set(), admin: {} };
    }

    renderSlots(dateStr);
  }

  function renderSlots(dateStr) {
    const grid = document.getElementById('slotGrid');
    grid.innerHTML = '';
    const data = adminTakenSlots[dateStr] || { customer: new Set(), admin: {} };

    const blockableSlots = SLOTS.filter(s => !data.customer.has(s));
    const allBlocked     = blockableSlots.length > 0 && blockableSlots.every(s => s in data.admin);

    const btn = document.getElementById('fullDayBtn');
    btn.style.display = blockableSlots.length ? 'block' : 'none';
    if (allBlocked) {
      btn.textContent = 'Unblock Full Day';
      btn.className = 'unblock-all';
      btn.onclick = () => unblockFullDay(dateStr);
    } else {
      btn.textContent = 'Block Full Day';
      btn.className = 'block-all';
      btn.onclick = () => blockFullDay(dateStr);
    }

    SLOTS.forEach(slot => {
      const isCust  = data.customer.has(slot);
      const isAdmin = slot in data.admin;
      const el = document.createElement('div');

      if (isCust) {
        el.className = 'slot-btn booked-customer';
        el.innerHTML = `<div class="slot-time">${slot}</div>
          <div class="slot-status">Customer Booked</div>
          <div class="slot-action">Cannot unblock</div>`;
      } else if (isAdmin) {
        el.className = 'slot-btn blocked-admin';
        el.innerHTML = `<div class="slot-time">${slot}</div>
          <div class="slot-status">Blocked by You</div>
          <div class="slot-action">Tap to unblock</div>`;
        el.onclick = () => unblockSlot(dateStr, slot, data.admin[slot]);
      } else {
        el.className = 'slot-btn available';
        el.innerHTML = `<div class="slot-time">${slot}</div>
          <div class="slot-status">Available</div>
          <div class="slot-action">Tap to block</div>`;
        el.onclick = () => blockSlot(dateStr, slot);
      }
      grid.appendChild(el);
    });
  }

  async function blockFullDay(dateStr) {
    const data = adminTakenSlots[dateStr] || { customer: new Set(), admin: {} };
    const toBlock = SLOTS.filter(s => !data.customer.has(s) && !(s in data.admin));
    await Promise.all(toBlock.map(slot => blockSlot(dateStr, slot)));
  }

  async function unblockFullDay(dateStr) {
    const data = adminTakenSlots[dateStr] || { customer: new Set(), admin: {} };
    const toUnblock = SLOTS.filter(s => s in data.admin);
    await Promise.all(toUnblock.map(slot => unblockSlot(dateStr, slot, data.admin[slot])));
  }

  async function blockSlot(dateStr, time) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/blocked_slots', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({ date: dateStr, time: time })
      });
      if (res.ok || res.status === 201) {
        const rows = await res.json();
        const id = Array.isArray(rows) && rows[0] ? rows[0].id : null;
        if (!adminTakenSlots[dateStr]) adminTakenSlots[dateStr] = { customer: new Set(), admin: {} };
        if (id) adminTakenSlots[dateStr].admin[time] = id;
        renderSlots(dateStr);
      } else {
        alert('Failed to block slot. Check Supabase RLS policies.');
      }
    } catch(e) {
      alert('Network error: ' + e.message);
    }
  }

  async function unblockSlot(dateStr, time, id) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/blocked_slots?id=eq.' + id, {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      if (res.ok) {
        delete adminTakenSlots[dateStr].admin[time];
        renderSlots(dateStr);
      } else {
        alert('Failed to unblock. Check Supabase RLS policies.');
      }
    } catch(e) {
      alert('Network error: ' + e.message);
    }
  }

  // ── Bookings list ────────────────────────
  let bookingFilter = 'upcoming';

  function setFilter(f, btn) {
    bookingFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadBookings();
  }

  async function loadBookings() {
    const list = document.getElementById('bookingsList');
    list.innerHTML = '<div class="spinner">Loading bookings…</div>';

    try {
      let url = SUPABASE_URL + '/rest/v1/bookings?select=*&order=date_iso.asc,time.asc';
      if (bookingFilter === 'upcoming') {
        const todayStr = adminToday.toISOString().split('T')[0];
        url += '&date_iso=gte.' + todayStr;
      }
      const res = await fetch(url, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });

      if (!res.ok) {
        list.innerHTML = '<div class="empty-state">Could not load bookings.<br>Check Supabase RLS — bookings needs a SELECT policy for anon.</div>';
        return;
      }

      const rows = await res.json();
      if (!rows.length) {
        list.innerHTML = '<div class="empty-state">No ' + (bookingFilter === 'upcoming' ? 'upcoming ' : '') + 'bookings yet.</div>';
        return;
      }

      list.innerHTML = '';
      rows.forEach(b => {
        const card = document.createElement('div');
        card.className = 'booking-card';
        const name = [b.first_name, b.last_name].filter(Boolean).join(' ') || '—';
        const dateLabel = b.date || b.date_iso || '—';
        card.innerHTML = `
          <div class="booking-header">
            <div class="booking-name">${esc(name)}</div>
            <div class="booking-date-badge">${esc(dateLabel)}</div>
          </div>
          <div class="booking-row">🕐 <strong>${esc(b.time || '—')}</strong></div>
          ${b.phone ? `<div class="booking-row">📞 ${esc(b.phone)}</div>` : ''}
          ${b.email ? `<div class="booking-row">✉️ ${esc(b.email)}</div>` : ''}
          ${b.address ? `<div class="booking-row">📍 ${esc(b.address)}</div>` : ''}
          ${b.notes ? `<div class="booking-row">💬 ${esc(b.notes)}</div>` : ''}
          <div class="booking-package">${esc(b.package || '—')}</div>
          ${b.add_ons ? `<div class="booking-row" style="margin-top:6px;">Add-ons: ${esc(b.add_ons)}</div>` : ''}
          ${b.monkey_bonus ? `<div class="booking-row" style="color:var(--dark-mint);">🐒 ${esc(b.monkey_bonus)}</div>` : ''}
          ${b.photo_urls ? `<div class="booking-row" style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">${b.photo_urls.split(',').map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" style="width:56px;height:56px;border-radius:8px;object-fit:cover;border:1.5px solid var(--border);"></a>`).join('')}</div>` : ''}
          <div class="booking-total">${esc(b.total || '')}</div>
        `;
        list.appendChild(card);
      });
    } catch(e) {
      list.innerHTML = '<div class="empty-state">Network error loading bookings.</div>';
    }
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Consults list ────────────────────────
  const CONSULT_SERVICE_LABELS = {
    storefront: 'Storefront & Retail',
    office: 'Office Building',
    high_rise: 'High-Rise',
    post_construction: 'Post-Construction',
    hoa_multi: 'HOA & Multi-Family'
  };

  let consultFilter = 'upcoming';

  function setConsultFilter(f, btn) {
    consultFilter = f;
    document.querySelectorAll('#panelConsults .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadConsults();
  }

  async function loadConsults() {
    const list = document.getElementById('consultsList');
    list.innerHTML = '<div class="spinner">Loading consults…</div>';
    try {
      let url = SUPABASE_URL + '/rest/v1/consult_bookings?select=*&order=date.asc,time.asc';
      if (consultFilter === 'upcoming') {
        url += '&date=gte.' + adminToday.toISOString().split('T')[0];
      }
      const res = await fetch(url, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      if (!res.ok) {
        list.innerHTML = '<div class="empty-state">Could not load consults.<br>Make sure the <code>consult_bookings</code> table exists with anon SELECT policy.</div>';
        return;
      }
      const rows = await res.json();
      if (!rows.length) {
        list.innerHTML = '<div class="empty-state">No ' + (consultFilter === 'upcoming' ? 'upcoming ' : '') + 'consultations yet.</div>';
        return;
      }
      list.innerHTML = '';
      rows.forEach(b => {
        const card = document.createElement('div');
        card.className = 'booking-card';
        const name = [b.first_name, b.last_name].filter(Boolean).join(' ') || '—';
        const isSite = b.type === 'site_visit';
        const typeLabel = isSite ? 'Site Visit' : 'Phone Consult';
        const badgeBg   = isSite ? 'var(--dark-mint)' : 'var(--orange)';
        const serviceLabel = CONSULT_SERVICE_LABELS[b.service_type] || b.service_type || '—';
        card.innerHTML = `
          <div class="booking-header">
            <div>
              <div class="booking-name">${esc(name)}</div>
              ${b.company ? `<div style="font-size:12px;color:var(--mid);margin-top:2px;">${esc(b.company)}</div>` : ''}
            </div>
            <div class="booking-date-badge" style="background:${badgeBg};">${esc(typeLabel)}</div>
          </div>
          <div class="booking-row">🗓 <strong>${esc(b.date || '—')}${b.time ? ' · ' + esc(b.time) : ''}</strong></div>
          <div class="booking-row">🏢 ${esc(serviceLabel)}</div>
          ${b.sizing_info ? `<div class="booking-row">📐 ${esc(b.sizing_info)}</div>` : ''}
          ${b.phone ? `<div class="booking-row">📞 ${esc(b.phone)}</div>` : ''}
          ${b.email ? `<div class="booking-row">✉ ${esc(b.email)}</div>` : ''}
          ${b.address ? `<div class="booking-row">📍 ${esc(b.address)}</div>` : ''}
          ${b.notes ? `<div class="booking-row">💬 ${esc(b.notes)}</div>` : ''}
        `;
        list.appendChild(card);
      });
    } catch(e) {
      list.innerHTML = '<div class="empty-state">Network error loading consults.</div>';
    }
  }

  // ── Reviews tool ──────────────────────────
  // Google's Places API hard-caps Place Details at 5 reviews, always its
  // "most relevant" pick -- there is no API path to more than that, so
  // manual entry exists alongside the fetch for anything beyond the cap.
  const REVIEWS_KEY = 'suds_reviews_v1';
  const PLACE_ID_KEY = 'suds_place_id';
  const AGG_KEY = 'suds_reviews_agg';
  let placesService = null;

  function loadReviews() {
    try { return JSON.parse(localStorage.getItem(REVIEWS_KEY)) || []; } catch(e) { return []; }
  }
  function saveReviews(list) { localStorage.setItem(REVIEWS_KEY, JSON.stringify(list)); }
  function loadAgg() {
    try { return JSON.parse(localStorage.getItem(AGG_KEY)) || null; } catch(e) { return null; }
  }
  function saveAgg(agg) { localStorage.setItem(AGG_KEY, JSON.stringify(agg)); }

  function initReviewsPanel() {
    const savedPlaceId = localStorage.getItem(PLACE_ID_KEY);
    if (savedPlaceId) document.getElementById('placeIdInput').value = savedPlaceId;
    const agg = loadAgg();
    document.getElementById('aggStatus').textContent = agg ? `Google: ${agg.rating}★ average across ${agg.user_ratings_total} reviews` : '';
    renderReviewsList();
  }

  function ensurePlacesService() {
    if (placesService) return placesService;
    if (!window.google || !window.google.maps || !window.google.maps.places) return null;
    placesService = new google.maps.places.PlacesService(document.getElementById('placesDummy'));
    return placesService;
  }

  function fetchGoogleReviews() {
    const placeId = document.getElementById('placeIdInput').value.trim();
    const statusEl = document.getElementById('fetchStatus');
    if (!placeId) { statusEl.className = 'status-msg err'; statusEl.textContent = 'Enter a Place ID first.'; return; }
    if (/^https?:\/\//i.test(placeId)) {
      statusEl.className = 'status-msg err';
      statusEl.textContent = "That looks like a Maps URL, not a Place ID. Use \"Find your Place ID →\" above — it should start with something like ChIJ...";
      return;
    }
    localStorage.setItem(PLACE_ID_KEY, placeId);
    const svc = ensurePlacesService();
    if (!svc) { statusEl.className = 'status-msg err'; statusEl.textContent = "Google Maps hasn't loaded yet — wait a second and try again."; return; }
    const btn = document.getElementById('fetchReviewsBtn');
    btn.disabled = true; btn.textContent = 'Fetching…';
    statusEl.className = 'status-msg'; statusEl.textContent = '';
    let settled = false;
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      btn.disabled = false; btn.textContent = 'Fetch Reviews from Google';
      statusEl.className = 'status-msg err';
      statusEl.textContent = "Google never responded after 10s -- likely the Places API isn't enabled for this key in Google Cloud Console, or the key's referrer restrictions are blocking this page. Check the browser console for a red Google Maps error for specifics.";
    }, 10000);
    svc.getDetails({ placeId, fields: ['reviews', 'rating', 'user_ratings_total', 'name'] }, function(place, status) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      btn.disabled = false; btn.textContent = 'Fetch Reviews from Google';
      if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
        statusEl.className = 'status-msg err';
        statusEl.textContent = 'Could not fetch (status: ' + status + '). Double-check the Place ID.';
        return;
      }
      saveAgg({ rating: place.rating, user_ratings_total: place.user_ratings_total, name: place.name });
      document.getElementById('aggStatus').textContent = `Google: ${place.rating}★ average across ${place.user_ratings_total} reviews`;
      const existing = loadReviews();
      const existingGoogleIds = new Set(existing.filter(r => r.source === 'google').map(r => r.id));
      const fetched = (place.reviews || []).map(r => ({
        id: 'g_' + r.time, source: 'google', rating: r.rating, text: r.text,
        author: r.author_name, time: r.relative_time_description,
        bucket: 'residential', featured: false
      }));
      const newOnes = fetched.filter(r => !existingGoogleIds.has(r.id));
      saveReviews(existing.concat(newOnes));
      renderReviewsList();
      statusEl.className = 'status-msg ok';
      statusEl.textContent = `Fetched ${fetched.length} review(s) from Google (its hard cap — ${newOnes.length} new).`;
    });
  }

  function addManualReview() {
    const author = document.getElementById('manAuthor').value.trim();
    const text = document.getElementById('manText').value.trim();
    const rating = parseInt(document.getElementById('manRating').value, 10);
    const bucket = document.getElementById('manBucket').value;
    if (!author || !text) { alert('Enter both an author name and the review text.'); return; }
    const list = loadReviews();
    list.push({ id: 'm_' + Date.now(), source: 'manual', rating, text, author, time: '', bucket, featured: false });
    saveReviews(list);
    document.getElementById('manAuthor').value = '';
    document.getElementById('manText').value = '';
    renderReviewsList();
  }

  function renderReviewsList() {
    const list = loadReviews();
    const container = document.getElementById('reviewsList');
    if (!list.length) { container.innerHTML = '<div class="empty-state">No reviews yet — fetch from Google or add one manually.</div>'; return; }
    container.innerHTML = '';
    list.forEach(r => {
      const card = document.createElement('div');
      card.className = 'review-card';
      card.innerHTML = `
        <div class="review-top">
          <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
          <div class="review-src">${r.source === 'google' ? 'Google' : 'Manual'}</div>
        </div>
        <div class="review-text">"${esc(r.text)}"</div>
        <div class="review-author">${esc(r.author)}</div>
        <div class="review-time">${esc(r.time || '')}</div>
        <div class="review-controls">
          <label class="review-feature-toggle">
            <input type="checkbox" ${r.featured ? 'checked' : ''} onchange="toggleFeatured('${r.id}', this.checked)">
            Feature on site
          </label>
          <select class="review-bucket-select" onchange="setBucket('${r.id}', this.value)">
            <option value="residential" ${r.bucket === 'residential' ? 'selected' : ''}>Residential</option>
            <option value="commercial" ${r.bucket === 'commercial' ? 'selected' : ''}>Commercial</option>
          </select>
          <button class="review-remove" onclick="removeReview('${r.id}')">Remove</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function toggleFeatured(id, val) {
    const list = loadReviews();
    const r = list.find(r => r.id === id);
    if (r) r.featured = val;
    saveReviews(list);
  }
  function setBucket(id, val) {
    const list = loadReviews();
    const r = list.find(r => r.id === id);
    if (r) r.bucket = val;
    saveReviews(list);
  }
  function removeReview(id) {
    saveReviews(loadReviews().filter(r => r.id !== id));
    renderReviewsList();
  }

  function generateReviewCode() {
    const list = loadReviews().filter(r => r.featured);
    const out = document.getElementById('codeOutput');
    const copyBtn = document.getElementById('copyCodeBtn');
    if (!list.length) {
      out.style.display = 'block';
      out.value = 'No reviews checked as "Feature on site" yet.';
      copyBtn.style.display = 'none';
      return;
    }
    const cardHtml = bucket => list.filter(r => r.bucket === bucket).map(r =>
`        <div class="testi-card">
          <div class="testi-stars">${'★'.repeat(r.rating)}</div>
          <div class="testi-quote">"${esc(r.text)}"</div>
          <div class="testi-name">${esc(r.author)}</div>
        </div>`).join('\n');

    const agg = loadAgg();
    const schema = {
      '@context': 'https://schema.org',
      '@type': 'HomeAndConstructionBusiness',
      name: (agg && agg.name) || 'Suds Monkey Window Cleaning',
      telephone: '+1-405-882-2277',
      url: 'https://sudsmonkey.github.io/Suds-calculator-/',
      review: list.map(r => ({
        '@type': 'Review',
        author: { '@type': 'Person', name: r.author },
        reviewRating: { '@type': 'Rating', ratingValue: String(r.rating), bestRating: '5' },
        reviewBody: r.text
      }))
    };
    if (agg && agg.rating) {
      schema.aggregateRating = { '@type': 'AggregateRating', ratingValue: String(agg.rating), reviewCount: String(agg.user_ratings_total) };
    }
    // A review containing the literal closing script-tag sequence would
    // otherwise end the tag early when pasted into index.html -- \/ is valid
    // JSON and renders identically, so this is safe to do unconditionally.
    const schemaJson = JSON.stringify(schema, null, 2).replace(/<\/script/gi, '<\\/script');

    out.style.display = 'block';
    out.value =
`/* ── Paste into index.html's "What homeowners say" .testi-grid ── */
${cardHtml('residential') || '  (none checked for Residential)'}

/* ── Paste into index.html's "What businesses say" .testi-grid ── */
${cardHtml('commercial') || '  (none checked for Commercial)'}

<!-- ── Paste this whole block into index.html's <head> ── -->
<script type="application/ld+json">
${schemaJson}
<\/script>`;
    copyBtn.style.display = 'inline-block';
  }

  function copyReviewCode() {
    const out = document.getElementById('codeOutput');
    out.select();
    navigator.clipboard.writeText(out.value).then(() => {
      const btn = document.getElementById('copyCodeBtn');
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; }, 1500);
    });
  }

  init();
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrEnJzvM5RCL_Y_TOymjadeQdmgB1swI8&libraries=places" async defer></script>
</body>
