<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suds Monkey Pro Portal</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FDF9F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F56E64;
    --orangeborder: #F0A9A5;
    --dark: #A6382E;
    --mint: #9ED9C0;
    --mintdeep: #2A7A5A;
    --cream: #FDF9F5;
    --mid: #7C7268;
    --white: #FFFFFF;
    --border: #E8DDD6;
    --radius: 20px;
    --shadow: 0 2px 16px rgba(245,110,100,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font-family: 'Nunito', sans-serif; }
  a { color: var(--orange); }

  .top { position: sticky; top: 0; z-index: 10; background: rgba(253,249,245,0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; margin: 0 auto; }
  .brand { font-family: 'Anton', sans-serif; font-style: italic; text-transform: uppercase; color: var(--orange); font-size: 19px; letter-spacing: 0.03em; line-height: 1; }
  .brand small { display: block; font-family: 'Nunito', sans-serif; font-style: normal; font-weight: 900; font-size: 9px; letter-spacing: 0.2em; color: var(--mid); margin-top: 3px; }
  .who { text-align: right; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: var(--dark); line-height: 1.2; }
  .who button { background: none; border: none; color: var(--mid); font-size: 11px; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 2px 0; }
  .tabs { display: flex; gap: 4px; max-width: 560px; margin: 10px auto 0; }
  .tab { flex: 1; background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-size: 14px; font-weight: 900; color: var(--mid); cursor: pointer; }
  .tab.on { color: var(--dark); border-bottom-color: var(--orange); }
  .tab .badge[hidden] { display: none; }
  .tab .badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 50px; background: var(--orange); color: #fff; font-size: 11px; margin-left: 4px; }

  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .sec { font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 900; color: var(--mid); letter-spacing: 0.08em; text-transform: uppercase; margin: 22px 0 10px; }
  .sec:first-child { margin-top: 4px; }
  .empty { background: var(--white); border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 22px 16px; text-align: center; color: var(--mid); font-size: 14px; }

  .card { background: var(--white); border: 1.5px solid var(--orangeborder); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .card.offer { border-color: var(--orange); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .payout { font-family: 'Nunito', sans-serif; font-size: 40px; font-weight: 900; color: var(--orange); line-height: 1; }
  .payout-label { font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); margin-top: 4px; }
  .rush-note { color: var(--orange); }
  .countdown { font-family: 'Nunito', sans-serif; text-align: right; }
  .countdown b { display: block; font-size: 22px; font-weight: 900; color: var(--dark); font-variant-numeric: tabular-nums; line-height: 1; }
  .countdown span { font-size: 11px; font-weight: 800; color: var(--mid); }
  .countdown.urgent b { color: var(--orange); }
  .pkg { font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 900; color: var(--dark); margin-top: 14px; }
  .addons { font-size: 13px; color: var(--mid); margin-top: 2px; }
  .addr { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; background: var(--cream); border-radius: 12px; font-size: 14px; font-weight: 500; color: #3d3530; }
  .addr a { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px; text-decoration: none; white-space: nowrap; border: 1.5px solid var(--orangeborder); border-radius: 50px; padding: 5px 10px; }
  .notes { font-size: 13px; color: var(--mid); margin-top: 10px; line-height: 1.45; }
  .notes b { color: var(--dark); }

  .times-label { font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 900; color: var(--mid); letter-spacing: 0.06em; text-transform: uppercase; margin: 14px 0 6px; }
  .times { display: flex; flex-direction: column; gap: 6px; }
  .time-opt { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; padding: 11px 12px; cursor: pointer; font-size: 15px; font-weight: 800; color: var(--dark); }
  .time-opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--orangeborder); }
  .time-opt .tlabel { display: block; font-size: 10px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); }
  .time-opt .tpay { font-size: 14px; font-weight: 900; color: var(--mid); }
  .time-opt.pref .tlabel { color: var(--orange); }
  .time-opt.sel { border-color: var(--orange); background: #FDF0EF; }
  .time-opt.sel .radio { border-color: var(--orange); background: radial-gradient(circle, var(--orange) 45%, transparent 50%); }
  .time-opt:disabled { opacity: 0.45; cursor: not-allowed; }

  .accept { display: block; width: 100%; margin-top: 14px; padding: 17px; border: none; border-radius: 50px; background: var(--orange); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 14px rgba(245,110,100,0.35); }
  .accept:disabled { opacity: 0.5; cursor: wait; }
  .decline { display: block; margin: 10px auto 0; background: none; border: none; color: var(--mid); font-size: 14px; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 6px 12px; }
  .err { color: var(--dark); background: #FDF0EF; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 10px; display: none; }
  .err.show { display: block; }

  .when { font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 900; color: var(--dark); }
  .when-sub { font-size: 13px; color: var(--mid); margin-top: 2px; }
  .pay-pill { font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 900; color: var(--orange); }
  .cust { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
  .cust a { font-family: 'Nunito', sans-serif; font-weight: 900; text-decoration: none; }
  .complete-btn { display: block; width: 100%; margin-top: 14px; padding: 14px; border-radius: 50px; border: 2px solid var(--mintdeep); background: var(--white); color: var(--mintdeep); font-size: 16px; font-weight: 900; cursor: pointer; }
  .photo-step { display: none; margin-top: 12px; padding: 12px; border: 1.5px dashed var(--mint); border-radius: 14px; background: #F3FBF7; }
  .photo-step.show { display: block; }
  .photo-step p { font-size: 13px; color: var(--mintdeep); margin-bottom: 8px; }
  .photo-pick { display: block; text-align: center; padding: 12px; border-radius: 12px; background: var(--white); border: 1.5px solid var(--mint); font-family: 'Nunito', sans-serif; font-weight: 900; color: var(--mintdeep); cursor: pointer; }
  .photo-pick input { display: none; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
  .done-btn { display: block; width: 100%; margin-top: 10px; padding: 14px; border: none; border-radius: 50px; background: var(--mintdeep); color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; }
  .done-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .total-box { background: var(--white); border: 1.5px solid var(--orangeborder); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
  .total-box b { display: block; font-family: 'Nunito', sans-serif; font-size: 26px; font-weight: 900; color: var(--dark); }
  .total-box span { font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); }
  .total-box.held b { color: var(--orange); }
  .total-box.paid b { color: var(--mintdeep); }
  .pay-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .pay-row .pr-main { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; color: var(--dark); }
  .pay-row .pr-sub { font-size: 12px; color: var(--mid); margin-top: 2px; }
  .pay-row .pr-amt { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 17px; color: var(--dark); text-align: right; }
  .pay-row .pr-amt small { display: block; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
  .pay-row.held .pr-amt small { color: var(--orange); }
  .pay-row.paid .pr-amt small { color: var(--mintdeep); }
  .fine { font-size: 12px; color: var(--mid); text-align: center; margin-top: 14px; line-height: 1.5; }

  .login { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; text-align: center; }
  .login h1 { font-family: 'Anton', sans-serif; font-style: italic; text-transform: uppercase; color: var(--orange); font-size: 34px; letter-spacing: 0.02em; }
  .login p { color: var(--mid); font-size: 14px; margin: 8px 0 20px; line-height: 1.5; }
  .login input { width: 100%; border: 1.5px solid var(--orangeborder); border-radius: 14px; padding: 14px; font-size: 16px; font-family: 'DM Sans', sans-serif; color: var(--dark); background: var(--white); outline: none; text-align: center; letter-spacing: 0.05em; }
  .login input:focus { border-color: var(--orange); }
  .loading { text-align: center; color: var(--mid); padding: 40px 0; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(120px); background: var(--dark); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; padding: 12px 18px; border-radius: 50px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); transition: transform 0.25s, opacity 0.25s; z-index: 50; max-width: calc(100% - 32px); text-align: center; opacity: 0; visibility: hidden; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div id="loginView" class="login" style="display:none;">
  <h1>Pro Portal</h1>
  <p>Enter the access code Suds Monkey sent you.</p>
  <form id="loginForm">
    <input id="codeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access code" aria-label="Access code">
    <button class="accept" type="submit">Log in</button>
  </form>
  <div class="err" id="loginErr"></div>
</div>

<div id="appView" style="display:none;">
  <header class="top">
    <div class="top-row">
      <div class="brand">Suds Monkey<small>PRO PORTAL</small></div>
      <div class="who"><div id="whoName"></div><button id="logoutBtn" type="button">Log out</button></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="jobs" role="tab" aria-selected="true">Jobs <span class="badge" id="offerBadge" hidden></span></button>
      <button class="tab" data-tab="payouts" role="tab" aria-selected="false">Payouts</button>
    </nav>
  </header>
  <main>
    <div id="jobsTab">
      <div class="sec">New offers</div>
      <div id="offersList"><div class="loading">Loading…</div></div>
      <div class="sec">Upcoming jobs</div>
      <div id="upcomingList"></div>
    </div>
    <div id="payoutsTab" hidden>
      <div class="totals">
        <div class="total-box held"><span>On 3-day hold</span><b id="heldTotal">$0</b></div>
        <div class="total-box paid"><span>Released</span><b id="paidTotal">$0</b></div>
      </div>
      <div class="sec">Completed jobs</div>
      <div id="payoutsList"></div>
      <p class="fine">Pay is held for 3 days after you mark a job complete, then released.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const SUPABASE_URL = 'https://ykjkcegpwiqhpfcgkwro.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_wVwjixnqqbFjjJqH7f9nhA_qHGpE4md';
  const CODE_KEY = 'sm_portal_code';
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const LABELS = ['Preferred', 'Alt 1', 'Alt 2'];

  let code = null;
  let jobs = [];
  const chosen = {};      // offer id -> option index the pro tapped
  const photos = {};      // offer id -> [File]

  // ── storage that survives private mode ───────────────────────────────
  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ── helpers ──────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function money(n) { const v = Number(n || 0); return '$' + (v % 1 ? v.toFixed(2) : v.toFixed(0)); }
  function dayLabel(iso) {
    if (!iso) return '';
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return DOW[dt.getDay()] + ', ' + MONTHS[m - 1] + ' ' + d;
  }
  const shortTime = t => String(t || '').replace(':00', '');
  function mapsUrl(addr) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr || ''); }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
  }

  async function rpc(fn, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify(Object.assign({ p_code: code }, args || {}))
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      const e = new Error((body && body.message) || ('Request failed (' + res.status + ')'));
      e.status = res.status; e.code = body && body.code;
      throw e;
    }
    return body;
  }

  // ── login ────────────────────────────────────────────────────────────
  async function login(c) {
    code = c;
    try {
      const me = await rpc('portal_me');
      store(CODE_KEY, c);
      $('whoName').textContent = me.company_name ? me.name + ' · ' + me.company_name : me.name;
      $('loginView').style.display = 'none';
      $('appView').style.display = 'block';
      await load();
      return true;
    } catch (e) {
      code = null;
      store(CODE_KEY, null);
      $('appView').style.display = 'none';
      $('loginView').style.display = 'block';
      const err = $('loginErr');
      err.textContent = /invalid access code/i.test(e.message) ? 'That code didn\'t work. Check it and try again.' :
        /portal_me|function/i.test(e.message) ? 'The portal isn\'t switched on yet. Ask Suds Monkey to finish setup.' :
        'Couldn\'t connect. Check your signal and try again.';
      err.classList.add('show');
      return false;
    }
  }
  $('loginForm').addEventListener('submit', e => { e.preventDefault(); const v = $('codeInput').value.trim(); if (v) login(v); });
  $('logoutBtn').addEventListener('click', () => { store(CODE_KEY, null); code = null; location.replace(location.pathname); });

  // ── tabs ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => { x.classList.toggle('on', x === t); x.setAttribute('aria-selected', x === t); });
    $('jobsTab').hidden = t.dataset.tab !== 'jobs';
    $('payoutsTab').hidden = t.dataset.tab !== 'payouts';
  }));

  // ── data ─────────────────────────────────────────────────────────────
  async function load() {
    try {
      jobs = await rpc('portal_jobs') || [];
      render();
    } catch (e) {
      if (/invalid access code/i.test(e.message)) { store(CODE_KEY, null); location.replace(location.pathname); return; }
      $('offersList').innerHTML = '<div class="empty">Couldn\'t load jobs. Check your signal and refresh the page.</div>';
    }
  }

  function render() {
    const offers = jobs.filter(j => j.status === 'offered');
    const upcoming = jobs.filter(j => j.status === 'accepted' && !j.completed_at);
    const done = jobs.filter(j => j.status === 'accepted' && j.completed_at);

    const badge = $('offerBadge');
    badge.hidden = !offers.length; badge.textContent = offers.length;

    $('offersList').innerHTML = offers.length ? offers.map(offerCard).join('') :
      '<div class="empty">No new offers right now. New jobs show up here.</div>';
    $('upcomingList').innerHTML = upcoming.length ? upcoming.map(upcomingCard).join('') :
      '<div class="empty">Jobs you accept show up here.</div>';
    renderPayouts(done);
    tick();
  }

  function selectedOption(j) {
    if (chosen[j.id] != null) return chosen[j.id];
    return 0;
  }

  function offerCard(j) {
    const opts = j.options || [];
    const sel = selectedOption(j);
    const o = opts[sel] || {};
    const rush = Number(o.rush || 0) > 0;
    return '<div class="card offer" data-id="' + esc(j.id) + '">' +
      '<div class="card-top">' +
        '<div><div class="payout" data-payout>' + money(o.payout) + '</div>' +
        '<div class="payout-label">Your payout' + (rush ? ' <span class="rush-note">· includes rush</span>' : '') + '</div></div>' +
        '<div class="countdown" data-expires="' + esc(j.expires_at) + '"><b>--:--</b><span>left to accept</span></div>' +
      '</div>' +
      '<div class="pkg">' + esc(j.package || 'Window cleaning') + '</div>' +
      (j.add_ons ? '<div class="addons">' + esc(j.add_ons) + '</div>' : '') +
      '<div class="addr"><span>' + esc(j.address || 'Address not given') + '</span>' +
        (j.address ? '<a href="' + mapsUrl(j.address) + '" target="_blank" rel="noopener">Map</a>' : '') + '</div>' +
      (j.notes ? '<div class="notes"><b>Notes:</b> ' + esc(j.notes) + '</div>' : '') +
      '<div class="times-label">Customer\'s times: tap one</div>' +
      '<div class="times">' + opts.map((t, i) =>
        '<button type="button" class="time-opt' + (i === 0 ? ' pref' : '') + (i === sel ? ' sel' : '') + '" data-opt="' + i + '" aria-pressed="' + (i === sel) + '">' +
          '<span class="radio"></span>' +
          '<span><span class="tlabel">' + LABELS[i] + '</span>' + esc(dayLabel(t.date_iso)) + ' · ' + esc(shortTime(t.time)) + '</span>' +
          '<span class="tpay">' + money(t.payout) + '</span>' +
        '</button>').join('') + '</div>' +
      '<button type="button" class="accept" data-accept>Accept ' + esc(dayLabel(o.date_iso)) + ' · ' + esc(shortTime(o.time)) + '</button>' +
      '<div class="err" data-err></div>' +
      '<button type="button" class="decline" data-decline>Decline</button>' +
    '</div>';
  }

  function upcomingCard(j) {
    const name = [j.first_name, j.last_name].filter(Boolean).join(' ');
    const ph = photos[j.id] || [];
    return '<div class="card" data-id="' + esc(j.id) + '">' +
      '<div class="card-top"><div><div class="when">' + esc(dayLabel(j.date_iso)) + ' · ' + esc(shortTime(j.time)) + '</div>' +
        '<div class="when-sub">' + esc(j.package || '') + (j.add_ons ? ' · ' + esc(j.add_ons) : '') + '</div></div>' +
        '<div class="pay-pill">' + money(j.payout) + '</div></div>' +
      '<div class="addr"><span>' + esc(j.address || '') + '</span>' +
        (j.address ? '<a href="' + mapsUrl(j.address) + '" target="_blank" rel="noopener">Map</a>' : '') + '</div>' +
      '<div class="cust"><span>' + esc(name) + '</span>' + (j.phone ? '<a href="tel:' + esc(String(j.phone).replace(/[^0-9+]/g, '')) + '">' + esc(j.phone) + '</a>' : '') + '</div>' +
      (j.notes ? '<div class="notes"><b>Notes:</b> ' + esc(j.notes) + '</div>' : '') +
      '<button type="button" class="complete-btn" data-complete>Mark complete</button>' +
      '<div class="photo-step' + (ph.length ? ' show' : '') + '" data-photostep>' +
        '<p>Add your after photos. Pay is held 3 days from when you finish.</p>' +
        '<label class="photo-pick">' + (ph.length ? 'Add more photos' : 'Take or choose photos') +
          '<input type="file" accept="image/*" multiple data-photos></label>' +
        '<div class="thumbs" data-thumbs></div>' +
        '<button type="button" class="done-btn" data-done' + (ph.length ? '' : ' disabled') + '>' +
          (ph.length ? 'Upload ' + ph.length + ' photo' + (ph.length > 1 ? 's' : '') + ' & finish' : 'Add at least one photo') + '</button>' +
        '<div class="err" data-err></div>' +
      '</div>' +
    '</div>';
  }

  function renderPayouts(done) {
    const now = Date.now();
    let held = 0, paid = 0;
    const rows = done.slice().sort((a, b) => String(b.completed_at).localeCompare(String(a.completed_at))).map(j => {
      const rel = new Date(j.released_at).getTime();
      const isHeld = rel > now;
      if (isHeld) held += Number(j.payout || 0); else paid += Number(j.payout || 0);
      const relD = new Date(j.released_at);
      return '<div class="pay-row ' + (isHeld ? 'held' : 'paid') + '">' +
        '<div><div class="pr-main">' + esc(dayLabel(j.date_iso)) + ' · ' + esc(j.package || '') + '</div>' +
        '<div class="pr-sub">' + esc(j.first_name || '') + ' · ' + j.photo_count + ' photo' + (j.photo_count === 1 ? '' : 's') + '</div></div>' +
        '<div class="pr-amt">' + money(j.payout) + '<small>' + (isHeld ? 'Releases ' + DOW[relD.getDay()] + ' ' + MONTHS[relD.getMonth()] + ' ' + relD.getDate() : 'Released') + '</small></div>' +
      '</div>';
    });
    $('heldTotal').textContent = money(held);
    $('paidTotal').textContent = money(paid);
    $('payoutsList').innerHTML = rows.length ? rows.join('') : '<div class="empty">Finished jobs and their payouts show up here.</div>';
  }

  // ── countdowns ───────────────────────────────────────────────────────
  function tick() {
    const now = Date.now();
    let expired = false;
    document.querySelectorAll('[data-expires]').forEach(el => {
      const left = new Date(el.dataset.expires).getTime() - now;
      if (left <= 0) { el.querySelector('b').textContent = '0:00:00'; expired = true; return; }
      const h = Math.floor(left / 3600000), m = Math.floor(left / 60000) % 60, s = Math.floor(left / 1000) % 60;
      el.querySelector('b').textContent = h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      el.classList.toggle('urgent', left < 3600000);
    });
    if (expired && !tick._reloading) { tick._reloading = true; load().finally(() => { tick._reloading = false; }); }
  }
  setInterval(tick, 1000);

  // ── actions ──────────────────────────────────────────────────────────
  function cardErr(card, msg) { const e = card.querySelector('[data-err]:not(.photo-step [data-err])') || card.querySelector('[data-err]'); e.textContent = msg; e.classList.add('show'); }

  document.addEventListener('click', async e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.id;
    const job = jobs.find(j => j.id === id);
    if (!job) return;

    const opt = e.target.closest('[data-opt]');
    if (opt) { chosen[id] = Number(opt.dataset.opt); render(); return; }

    if (e.target.closest('[data-accept]')) {
      const btn = e.target.closest('[data-accept]');
      btn.disabled = true; btn.textContent = 'Accepting…';
      try {
        const r = await rpc('portal_accept', { p_offer_id: id, p_option: selectedOption(job) });
        notifyCustomer(job.booking_id);
        toast('Job accepted: ' + dayLabel((job.options[selectedOption(job)] || {}).date_iso) + ' · ' + shortTime(r.time) + ' · ' + money(r.payout));
        delete chosen[id];
        await load();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Accept';
        cardErr(card, err.message);
        if (/no longer open|already took|expired/i.test(err.message)) setTimeout(load, 1800);
      }
      return;
    }

    if (e.target.closest('[data-decline]')) {
      if (!confirm('Decline this job?')) return;
      try { await rpc('portal_decline', { p_offer_id: id }); toast('Declined'); await load(); }
      catch (err) { cardErr(card, err.message); }
      return;
    }

    if (e.target.closest('[data-complete]')) {
      card.querySelector('[data-photostep]').classList.add('show');
      return;
    }

    if (e.target.closest('[data-done]')) {
      const btn = e.target.closest('[data-done]');
      const files = photos[id] || [];
      if (!files.length) return;
      btn.disabled = true;
      try {
        const paths = [];
        for (let i = 0; i < files.length; i++) {
          btn.textContent = 'Uploading ' + (i + 1) + ' of ' + files.length + '…';
          paths.push(await uploadPhoto(id, files[i], i));
        }
        btn.textContent = 'Finishing…';
        await rpc('portal_complete', { p_offer_id: id, p_photo_paths: paths });
        delete photos[id];
        toast('Job complete. Pay releases in 3 days.');
        await load();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Try again';
        const pe = card.querySelector('.photo-step [data-err]'); pe.textContent = err.message; pe.classList.add('show');
      }
    }
  });

  document.addEventListener('change', e => {
    const input = e.target.closest('[data-photos]');
    if (!input) return;
    const card = input.closest('.card');
    const id = card.dataset.id;
    photos[id] = (photos[id] || []).concat(Array.from(input.files || []).filter(f => /^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name)));
    render();
    // render() rebuilt the card; show thumbnails on the new one.
    const fresh = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    if (!fresh) return;
    const thumbs = fresh.querySelector('[data-thumbs]');
    photos[id].forEach(f => { const img = document.createElement('img'); img.alt = ''; img.src = URL.createObjectURL(f); thumbs.appendChild(img); });
  });

  // Fire-and-forget: emails the customer "<pro> with <company> took your
  // <day> <time>". The function only sends once per booking, and only after a
  // real accept (see supabase/functions/bright-endpoint).
  function notifyCustomer(bookingId) {
    if (bookingId == null) return;
    fetch(SUPABASE_URL + '/functions/v1/bright-endpoint', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ type: 'accepted', booking_id: bookingId })
    }).catch(err => console.warn('Customer notice failed:', err));
  }

  // Shrinks phone photos to ~1600px JPEG before upload; falls back to the
  // original file if the browser can't decode it (e.g. some HEIC).
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      return blob ? { blob: blob, ext: 'jpg', type: 'image/jpeg' } : null;
    } catch (e) { return null; }
  }
  async function uploadPhoto(offerId, file, i) {
    const s = await shrink(file);
    const blob = s ? s.blob : file;
    const ext = s ? s.ext : ((file.name.split('.').pop() || 'jpg').toLowerCase());
    const path = offerId + '/' + Date.now() + '-' + i + '.' + ext;
    const res = await fetch(SUPABASE_URL + '/storage/v1/object/job-photos/' + path, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': s ? s.type : (file.type || 'application/octet-stream') },
      body: blob
    });
    if (!res.ok) throw new Error('Photo upload failed (' + res.status + '). Check your signal and try again.');
    return path;
  }

  // ── start ────────────────────────────────────────────────────────────
  setInterval(() => { if (code && !document.hidden) load(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (code && !document.hidden) load(); });

  (function start() {
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get('code');
    if (fromUrl) history.replaceState(null, '', location.pathname);   // keep the code out of screenshots/history
    const c = fromUrl || recall(CODE_KEY);
    if (c) login(c); else $('loginView').style.display = 'block';
  })();
</script>
</body>
