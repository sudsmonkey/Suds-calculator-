<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Consultation – Suds Monkey</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #F56E64;
  --mint: #9ED9C0;
  --cream: #FDF9F5;
  --dark: #A6382E;
  --mid: #7C7268;
  --ink: #2B2218;
  --white: #FFFFFF;
  --border: #EDE5DC;
  --radius: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); -webkit-font-smoothing: antialiased; }

/* Nav */
.top-nav {
  position: relative;
  z-index: 11;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.back-link { color: var(--mid); font-size: 13px; font-weight: 700; text-decoration: none; }
.back-link:hover { color: var(--dark); }
.nav-phone { color: var(--dark); font-size: 13px; font-weight: 700; text-decoration: none; }
.nav-phone:hover { color: var(--orange); }

/* Hero — locked */
.header {
  position: sticky;
  top: 0;
  z-index: 10;
  overflow: hidden;
  padding: 120px 24px 100px;
  background: #111;
}
.header-bg {
  position: absolute; inset: 0;
  background: url('img-wash.jpg') center 40%/cover no-repeat;
  opacity: 0.55;
}
.header-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(166,56,46,0.28) 0%, rgba(80,20,15,0.38) 100%);
}

/* Question sections */
.q-section {
  position: relative;
  z-index: 1;
  background: var(--cream);
  padding: 40px 20px 48px;
}
.q-section + .q-section {
  border-top: 1px solid var(--border);
}

.q-num {
  font-family: 'Anton', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--orange);
  margin-bottom: 6px;
}
.q-head {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 4px;
  line-height: 1.2;
}
.q-sub {
  font-size: 13px;
  color: var(--mid);
  margin-bottom: 22px;
  line-height: 1.5;
}

/* Multiple choice card */
.mc-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  max-width: 440px;
}
.mc-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  cursor: pointer;
  transition: background 0.12s;
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.mc-option:last-child { border-bottom: none; }
.mc-option:hover { background: #FEF8F7; }
.mc-option.sel { background: var(--orange); border-color: var(--orange); }
.mc-option.sel .mc-label { color: #fff; }
.mc-option.sel .mc-dot { border-color: #fff; background: #fff; }
.mc-option.sel .mc-dot::after { opacity: 1; }
.mc-label {
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: var(--dark);
}
.mc-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  position: relative;
  transition: all 0.12s;
}
.mc-dot::after {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--orange);
  opacity: 0;
  transition: opacity 0.12s;
}
</style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="back-link">← Back</a>
  <a href="tel:4058822277" class="nav-phone">(405) 882-2277</a>
</nav>

<div class="header">
  <div class="header-bg"></div>
  <div class="header-overlay"></div>
</div>

<!-- Q1: Property type -->
<section class="q-section" id="q1">
  <div class="q-num">01</div>
  <h2 class="q-head">What type of property?</h2>
  <p class="q-sub">We'll tailor the scope to your situation.</p>
  <div class="mc-card">
    <div class="mc-option" id="tile-office" onclick="selectType('office')">
      <span class="mc-label">Office</span><span class="mc-dot"></span>
    </div>
    <div class="mc-option" id="tile-restaurant" onclick="selectType('restaurant')">
      <span class="mc-label">Restaurant</span><span class="mc-dot"></span>
    </div>
    <div class="mc-option" id="tile-retail" onclick="selectType('retail')">
      <span class="mc-label">Retail</span><span class="mc-dot"></span>
    </div>
    <div class="mc-option" id="tile-medical" onclick="selectType('medical')">
      <span class="mc-label">Medical</span><span class="mc-dot"></span>
    </div>
    <div class="mc-option" id="tile-warehouse" onclick="selectType('warehouse')">
      <span class="mc-label">Warehouse</span><span class="mc-dot"></span>
    </div>
    <div class="mc-option" id="tile-other" onclick="selectType('other')">
      <span class="mc-label">Other</span><span class="mc-dot"></span>
    </div>
  </div>
</section>

<script>
  let selectedType = null;

  function selectType(type) {
    selectedType = type;
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('sel'));
    document.getElementById('tile-' + type).classList.add('sel');
    // Next question will scroll here once built
  }
</script>
</body>
</html>
