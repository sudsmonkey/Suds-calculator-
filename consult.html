<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Consultation – Suds Monkey</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #F56E64;
  --mint: #9ED9C0;
  --cream: #FDF9F5;
  --dark: #A6382E;
  --mid: #7C7268;
  --ink: #2B2218;
  --white: #FFFFFF;
  --border: #EDE5DC;
  --radius: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); -webkit-font-smoothing: antialiased; }

/* Nav */
.top-nav {
  position: relative;
  z-index: 11;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.back-link { color: var(--mid); font-size: 13px; font-weight: 700; text-decoration: none; }
.back-link:hover { color: var(--dark); }
.nav-phone { color: var(--dark); font-size: 13px; font-weight: 700; text-decoration: none; }
.nav-phone:hover { color: var(--orange); }

/* Hero — locked */
.header {
  position: sticky;
  top: 0;
  z-index: 10;
  overflow: hidden;
  padding: 120px 24px 100px;
  background: #111;
}
.header-bg {
  position: absolute; inset: 0;
  background: url('img-wash.jpg') center 40%/cover no-repeat;
  opacity: 0.55;
}
.header-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(166,56,46,0.28) 0%, rgba(80,20,15,0.38) 100%);
}

/* Question sections */
.q-section {
  position: relative;
  z-index: 1;
  background: var(--cream);
  padding: 40px 20px 48px;
}
.q-section + .q-section {
  border-top: 1px solid var(--border);
}

.q-num {
  font-family: 'Anton', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--orange);
  margin-bottom: 6px;
}
.q-head {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 4px;
  line-height: 1.2;
}
.q-sub {
  font-size: 13px;
  color: var(--mid);
  margin-bottom: 22px;
  line-height: 1.5;
}

/* Property type tiles */
.tile-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 440px;
}
.tile {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 22px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.tile:hover { border-color: var(--orange); background: #FEF8F7; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(245,110,100,0.12); }
.tile.sel { background: var(--orange); border-color: var(--orange); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(245,110,100,0.25); }
.tile.sel .tile-name { color: #fff; }
.tile-emoji { font-size: 30px; display: block; margin-bottom: 8px; line-height: 1; }
.tile-name { font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: var(--dark); line-height: 1.25; }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="back-link">← Back</a>
  <a href="tel:4058822277" class="nav-phone">(405) 882-2277</a>
</nav>

<div class="header">
  <div class="header-bg"></div>
  <div class="header-overlay"></div>
</div>

<!-- Q1: Property type -->
<section class="q-section" id="q1">
  <div class="q-num">01</div>
  <h2 class="q-head">What type of property?</h2>
  <p class="q-sub">We'll tailor the scope to your situation.</p>
  <div class="tile-grid">
    <div class="tile" id="tile-office" onclick="selectType('office')">
      <span class="tile-emoji">🏢</span>
      <div class="tile-name">Office</div>
    </div>
    <div class="tile" id="tile-restaurant" onclick="selectType('restaurant')">
      <span class="tile-emoji">🍽️</span>
      <div class="tile-name">Restaurant</div>
    </div>
    <div class="tile" id="tile-retail" onclick="selectType('retail')">
      <span class="tile-emoji">🛍️</span>
      <div class="tile-name">Retail</div>
    </div>
    <div class="tile" id="tile-medical" onclick="selectType('medical')">
      <span class="tile-emoji">🏥</span>
      <div class="tile-name">Medical</div>
    </div>
    <div class="tile" id="tile-warehouse" onclick="selectType('warehouse')">
      <span class="tile-emoji">📦</span>
      <div class="tile-name">Warehouse</div>
    </div>
    <div class="tile" id="tile-other" onclick="selectType('other')">
      <span class="tile-emoji">🏗️</span>
      <div class="tile-name">Other</div>
    </div>
  </div>
</section>

<script>
  let selectedType = null;

  function selectType(type) {
    selectedType = type;
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('sel'));
    document.getElementById('tile-' + type).classList.add('sel');
    // Next question will scroll here once built
  }
</script>
</body>
</html>
