<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suds Monkey — Book Your Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F56E64;
    --orangeborder: #F0A9A5;
    --mint: #9ED9C0;
    --cream: #FDF9F5;
    --dark: #A6382E;
    --mid: #7C7268;
    --white: #FFFFFF;
    --radius: 20px;
    --shadow: 0 2px 16px rgba(245,110,100,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); min-height: 100vh; }
  .header { background: #111; padding: 60px 24px 60px; text-align: center; position: fixed; left: 0; right: 0; overflow: hidden; z-index: 100; }
  .header-bg { position: absolute; inset: 0; background: url('img-res-tree.jpg') center 40%/cover no-repeat; display: none; }
  .header-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(166,56,46,0.28) 0%, rgba(80,20,15,0.38) 100%); z-index: 0; }
  .header > *:not(.header-bg):not(.header-overlay) { position: relative; z-index: 1; }
  .top-nav { background: var(--white); border-bottom: 1px solid #F0E8DE; padding: 10px 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
  .back-link { color: var(--mid); font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 0.02em; }
  .back-link:hover { color: var(--dark); }
  .header-phone { position: absolute; top: 14px; right: 16px; color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700; text-decoration: none; }
  .header-phone:hover { color: #fff; }
  .header-logo { width: 70px; height: 70px; border-radius: 50%; background: #F7F1EC; border: 3px solid var(--mint); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; overflow: hidden; }
  .header-logo img { width: 100%; height: 100%; object-fit: cover; }
  .header h1 { color: #fff; font-size: 22px; font-weight: 900; }
  .header p { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 4px; }
  .pkg-pill { background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.4); border-radius: 50px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; }
  .pkg-pill span { color: #fff; font-size: 13px; font-weight: 700; }
  .pkg-pill .pkg-price { background: #fff; color: var(--dark); border-radius: 50px; padding: 2px 10px; font-size: 12px; font-weight: 900; }

  #heroSpacer { height: 0; }
  .content { padding: 20px 16px 40px; max-width: 440px; margin: 0 auto; position: relative; z-index: 150; background: var(--cream); }
  .section-label { font-size: 11px; font-weight: 900; color: var(--mid); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; margin-top: 24px; }
  .section-label:first-child { margin-top: 0; }

  /* Calendar */
  .calendar-card { background: var(--white); border: 1.5px solid var(--orangeborder); border-radius: var(--radius); box-shadow: var(--shadow); }
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid #F5EDE4; }
  .month-nav button { background: none; border: none; cursor: pointer; color: var(--orange); font-size: 22px; font-weight: 900; padding: 4px 10px; border-radius: 8px; transition: background 0.15s; line-height: 1; }
  .month-nav button:hover { background: #FDF0EF; }
  .month-name { font-size: 17px; font-weight: 900; color: var(--dark); }
  .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 12px 4px; }
  .day-header { text-align: center; font-size: 11px; font-weight: 700; color: var(--mid); letter-spacing: 0.05em; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 4px 12px 16px; }
  .cal-day { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; color: var(--dark); position: relative; }
  .cal-day:hover:not(.disabled):not(.empty) { background: #FDF0EF; }
  .cal-day.empty, .cal-day.disabled { cursor: default; }
  .cal-day.disabled { color: #DDD3C4; }
  .cal-day.selected { background: var(--orange) !important; color: #fff; }
  .cal-day.today { border: 2px solid var(--mint); }
  .cal-day.has-slots::after { content: ''; display: block; width: 5px; height: 5px; background: #5aab8a; border-radius: 50%; position: absolute; bottom: 3px; }
  .cal-day.partial::after  { content: ''; display: block; width: 5px; height: 5px; background: var(--orange); border-radius: 50%; position: absolute; bottom: 3px; }
  .cal-day.full-booked { color: #C8B8AA; cursor: not-allowed; }
  .cal-day.full-booked:hover { background: none; }
  .cal-legend { display: flex; gap: 14px; justify-content: center; padding: 10px 12px 14px; border-top: 1px solid #F5EDE4; }
  .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--mid); }
  .cal-legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cal-legend-dot.open    { background: #5aab8a; }
  .cal-legend-dot.limited { background: var(--orange); }
  .cal-legend-dot.full    { background: #C8B8AA; }


  /* Time slots */
  .time-card { background: var(--white); border: 1.5px solid var(--orangeborder); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .time-slot { border: 1.5px solid var(--orangeborder); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: border-color 0.15s; }
  .time-slot:hover:not(.booked) { border-color: var(--orange); background: #FDF0EF; }
  .time-slot.selected, .time-slot.selected:hover { background: var(--dark); border-color: var(--dark); }
  .time-slot.selected .time-main, .time-slot.selected:hover .time-main { color: #fff; }
  .time-slot.selected .time-sub, .time-slot.selected:hover .time-sub { color: rgba(255,255,255,0.8); }
  .time-slot.booked { background: #F5EDE4; border-color: #DDD3C4; cursor: not-allowed; opacity: 0.5; }
  .time-main { font-size: 15px; font-weight: 900; color: var(--dark); }
  .time-sub { font-size: 11px; color: var(--mid); margin-top: 2px; }

  /* Info form */
  .info-card { background: var(--white); border: 1.5px solid var(--orangeborder); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .info-row { display: flex; flex-direction: column; gap: 10px; }
  .info-row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .info-field label { font-size: 11px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 4px; }
  .info-field input, .info-field textarea { width: 100%; border: 1.5px solid #DDD3C4; border-radius: 10px; padding: 10px 12px; font-family: 'Nunito', sans-serif; font-size: 16px; color: var(--dark); background: var(--cream); outline: none; transition: border 0.15s; }
  .info-field input:focus, .info-field textarea:focus { border-color: var(--orange); }
  .info-field textarea { resize: none; height: 70px; }

  /* Summary */
  .summary-card { background: var(--white); border: 1.5px solid var(--orangeborder); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #F5EDE4; font-size: 14px; }
  .summary-row:last-child { border-bottom: none; padding-top: 10px; }
  .summary-row .label { color: var(--mid); }
  .summary-row .value { font-weight: 700; color: var(--dark); }
  .summary-row.total .label { font-weight: 900; color: var(--dark); font-size: 15px; }
  .summary-row.total .value { font-size: 18px; font-weight: 900; color: var(--orange); }


  .book-btn { display: block; width: 100%; padding: 16px; border-radius: 50px; border: none; background: var(--orange); color: #fff; font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 900; cursor: pointer; margin-top: 20px; transition: opacity 0.15s; }
  .book-btn:hover { opacity: 0.88; }
  .book-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  body.has-bg-bubbles { background: transparent; }
  #bgBubbleLayer { position: fixed; inset: 0; z-index: -1; background: var(--cream); pointer-events: none; overflow: hidden; }
  .bg-bubble { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; animation: bgBubbleFloat linear infinite; }
  @keyframes bgBubbleFloat {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.65; }
    90%  { opacity: 0.45; }
    100% { transform: translateY(-120vh) translateX(8px); opacity: 0; }
  }

  @media (min-width: 900px) {
    body { zoom: 0.95; }
    .content { max-width: 1200px; padding: 28px 32px 60px; }
    .month-nav { padding: 20px 24px 14px; }
    .month-name { font-size: 20px; }
    .day-headers { padding: 10px 16px 6px; }
    .day-header { font-size: 12px; }
    .cal-grid { gap: 6px; padding: 6px 16px 20px; }
    .cal-day { height: 56px; font-size: 16px; }
    .time-card { padding: 20px; }
    .time-grid { gap: 12px; }
    .time-slot { padding: 16px 12px; border-radius: 16px; }
    .time-main { font-size: 17px; }
    .time-sub { font-size: 12px; margin-top: 4px; }
    .info-card { padding: 24px; }
    .info-field input, .info-field textarea { font-size: 16px; padding: 12px 14px; }
    .info-field textarea { height: 80px; }
    .summary-card { padding: 24px; }
    .summary-row { font-size: 16px; padding: 8px 0; }
    .summary-row.total .label { font-size: 17px; }
    .summary-row.total .value { font-size: 20px; }
    .book-btn { font-size: 19px; padding: 18px; margin-top: 24px; }
    .section-label { font-size: 12px; margin-top: 30px; }
    #bookSuccess { padding: 40px 32px; }
    #bookSuccess div:first-child { font-size: 26px !important; }
    #bookSuccess div:last-child { font-size: 16px !important; }
  }
</style>
</head>
<body>
<nav class="top-nav"><a href="/Suds-calculator-/" class="back-link">← Back</a></nav>
<div class="header">
  <div class="header-bg"></div>
  <div class="header-overlay"></div>
  <h1>Book Your Clean</h1>
  <p>Suds Monkey Window Cleaning</p>
  <div class="pkg-pill">
    <span id="pillPkgName">Package</span>
    <span class="pkg-price" id="pillPkgPrice">—</span>
  </div>
</div>

<div id="heroSpacer"></div>
<div class="content">

  <div class="section-label">Pick a Date</div>
  <div class="calendar-card">
    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <div class="month-name" id="monthName"></div>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="day-headers">
      <div class="day-header">Su</div>
      <div class="day-header">Mo</div>
      <div class="day-header">Tu</div>
      <div class="day-header">We</div>
      <div class="day-header">Th</div>
      <div class="day-header">Fr</div>
      <div class="day-header">Sa</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot open"></div> Open</div>
      <div class="cal-legend-item"><div class="cal-legend-dot limited"></div> Limited</div>
      <div class="cal-legend-item"><div class="cal-legend-dot full"></div> Full</div>
    </div>
  </div>

  <div id="timeSection">
    <div class="section-label">Choose a Time</div>
    <div class="time-card">
      <div class="time-grid" id="timeGrid"></div>
    </div>
  </div>

  <div id="infoSection">
    <div class="section-label">Your Info</div>
    <div class="info-card">
      <div class="info-row">
        <div class="info-row-split">
          <div class="info-field">
            <label>First Name</label>
            <input type="text" id="infoFirstName" placeholder="Jane">
          </div>
          <div class="info-field">
            <label>Last Name</label>
            <input type="text" id="infoLastName" placeholder="Smith">
          </div>
        </div>
        <div class="info-field">
          <label>Phone</label>
          <input type="tel" id="infoPhone" placeholder="(555) 000-0000" autocomplete="tel">
        </div>
        <div class="info-field">
          <label>Email</label>
          <input type="email" id="infoEmail" placeholder="jane@email.com">
        </div>
        <div class="info-field">
          <label>Address (optional)</label>
          <input type="text" id="infoAddress" placeholder="123 Main St" autocomplete="off">
        </div>
        <div class="info-field">
          <label>Notes (optional)</label>
          <textarea id="infoNotes" placeholder="Gate code, dogs, anything we should know..."></textarea>
        </div>
      </div>
    </div>

    <div class="section-label">Summary</div>
    <div class="summary-card">
      <div class="summary-row">
        <span class="label">Package</span>
        <span class="value" id="summaryPkgName">—</span>
      </div>
      <div class="summary-row">
        <span class="label">Date</span>
        <span class="value" id="summaryDate">—</span>
      </div>
      <div class="summary-row">
        <span class="label">Time</span>
        <span class="value" id="summaryTime">—</span>
      </div>
      <div id="summaryAddonsList"></div>
      <div class="summary-row total">
        <span class="label">Total</span>
        <span class="value" id="summaryPkgTotal">—</span>
      </div>
    </div>

    <button class="book-btn" id="bookBtn" disabled>Confirm Booking</button>
    <div id="bookSuccess" style="display:none; text-align:center; padding:32px 24px; background:#E8F8F2; border-radius:20px; border:1.5px solid #9ED9C0;">
      <div style="font-size:22px; font-weight:900; color:#2A7A5A; margin-bottom:8px;">You're booked!</div>
      <div style="font-size:14px; color:#3A9A6E;">We'll send a confirmation to your email. See you soon!</div>
    </div>
  </div>

</div>

<script>
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const SLOTS = ['8:00 AM','1:00 PM'];

  // Consult mode — Phone Consultation or Site Visit
  const _cpkg = (new URLSearchParams(window.location.search).get('pkg') || '').toLowerCase();
  const isConsult = _cpkg.includes('consultation') || _cpkg.includes('site visit');
  const consultDuration = _cpkg.includes('site visit') ? '~1 hr' : '~30 min';

  function _seededRand(seed) {
    let s = seed >>> 0;
    return function() { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0x100000000; };
  }
  function slotMins(slot) {
    const [t, p] = slot.split(' ');
    const [h, m] = t.split(':').map(Number);
    return (p === 'PM' && h !== 12 ? h + 12 : p === 'AM' && h === 12 ? 0 : h) * 60 + m;
  }
  const _CM = ['8:15 AM','8:45 AM','9:15 AM','9:45 AM','10:15 AM','10:45 AM','11:15 AM','11:45 AM'];
  const _CA = ['1:15 PM','1:45 PM','2:15 PM','2:45 PM','3:15 PM','3:45 PM','4:15 PM','4:45 PM'];
  function getConsultSlots(dateStr) {
    const rand = _seededRand(parseInt(dateStr.replace(/-/g,''), 10));
    const total = rand() < 0.45 ? 2 : 3;
    const morning = _CM[Math.floor(rand() * _CM.length)];
    const afternoon = _CA[Math.floor(rand() * _CA.length)];
    const slots = [morning, afternoon];
    if (total === 3) {
      const pool = rand() < 0.5 ? _CM : _CA;
      let idx = Math.floor(rand() * pool.length);
      let extra = pool[idx];
      if (slots.includes(extra)) extra = pool[(idx + 1) % pool.length];
      slots.push(extra);
      slots.sort((a, b) => slotMins(a) - slotMins(b));
    }
    return slots;
  }

  const today = new Date();
  today.setHours(0,0,0,0);
  const isAdmin = sessionStorage.getItem('suds_admin') === '1';
  const maxDate = new Date(today);
  maxDate.setDate(maxDate.getDate() + 25);

  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth();
  let selectedDate = null;
  let selectedTime = null;
  let takenSlots = new Set();
  let monthAvailability = {};

  const SUPABASE_URL = 'https://ykjkcegpwiqhpfcgkwro.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_wVwjixnqqbFjjJqH7f9nhA_qHGpE4md';

  async function fetchMonthAvailability(year, month) {
    const pad = n => String(n).padStart(2,'0');
    const from = year + '-' + pad(month+1) + '-01';
    const last = new Date(year, month+1, 0).getDate();
    const to   = year + '-' + pad(month+1) + '-' + pad(last);
    try {
      const [bRes, blRes] = await Promise.all([
        fetch(SUPABASE_URL + '/rest/v1/bookings?select=date_iso,time&date_iso=gte.' + from + '&date_iso=lte.' + to, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        }),
        fetch(SUPABASE_URL + '/rest/v1/blocked_slots?select=date,time&date=gte.' + from + '&date=lte.' + to, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        })
      ]);
      const booked  = bRes.ok  ? await bRes.json() : [];
      const blocked = blRes.ok ? await blRes.json() : [];
      const map = {};
      const isConsultSlot = t => t && (t.includes(':15') || t.includes(':45'));
      booked.forEach(r => {
        if (!r.date_iso) return;
        if (!isConsult || isConsultSlot(r.time)) map[r.date_iso] = (map[r.date_iso] || 0) + 1;
      });
      blocked.forEach(r => {
        if (!r.date) return;
        if (!isConsult || isConsultSlot(r.time)) map[r.date] = (map[r.date] || 0) + 1;
      });
      monthAvailability = map;
    } catch(e) {
      console.warn('Month availability fetch failed:', e);
      monthAvailability = {};
    }
  }

  async function fetchTakenSlots(dateStr) {
    takenSlots = new Set();
    try {
      const [bRes, blRes] = await Promise.all([
        fetch(SUPABASE_URL + '/rest/v1/bookings?select=time&date_iso=eq.' + dateStr, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        }),
        fetch(SUPABASE_URL + '/rest/v1/blocked_slots?select=time&date=eq.' + dateStr, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        })
      ]);
      const booked  = bRes.ok  ? await bRes.json()  : [];
      const blocked = blRes.ok ? await blRes.json() : [];
      [...booked, ...blocked].forEach(r => takenSlots.add(r.time));
    } catch(e) {
      console.warn('Availability check failed:', e);
    }
  }

  async function renderCalendar() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    document.getElementById('monthName').textContent = MONTHS[currentMonth] + ' ' + currentYear;

    await fetchMonthAvailability(currentYear, currentMonth);

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
    const pad = n => String(n).padStart(2,'0');

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(currentYear, currentMonth, d);
      date.setHours(0,0,0,0);
      const dateStr = currentYear + '-' + pad(currentMonth+1) + '-' + pad(d);
      const dow = date.getDay();
      const isPast = date < today;
      const isWeekend = dow === 0 || dow === 6;
      const el = document.createElement('div');
      const taken = monthAvailability[dateStr] || 0;
      const dayTotal = isConsult ? getConsultSlots(dateStr).length : SLOTS.length;

      if (isPast || isWeekend || (!isAdmin && date > maxDate)) {
        el.className = 'cal-day disabled';
      } else if (taken >= dayTotal) {
        el.className = 'cal-day full-booked';
      } else if (taken === dayTotal - 1) {
        el.className = 'cal-day partial';
        el.onclick = () => selectDate(dateStr, d);
      } else {
        el.className = 'cal-day has-slots';
        el.onclick = () => selectDate(dateStr, d);
      }

      el.dataset.date = dateStr;
      if (date.getTime() === today.getTime()) el.classList.add('today');
      if (dateStr === selectedDate) el.classList.add('selected');

      el.textContent = d;
      grid.appendChild(el);
    }
  }

  async function selectDate(dateStr, d) {
    selectedDate = dateStr;
    selectedTime = null;
    // Toggle selected class without re-rendering the whole calendar
    document.querySelectorAll('#calGrid .cal-day.selected').forEach(el => el.classList.remove('selected'));
    const dayEl = document.querySelector('#calGrid [data-date="' + dateStr + '"]');
    if (dayEl) dayEl.classList.add('selected');

    const grid = document.getElementById('timeGrid');
    grid.innerHTML = '';
    const skeletonSlots = isConsult ? getConsultSlots(dateStr) : SLOTS;
    grid.style.gridTemplateColumns = skeletonSlots.length === 3 ? '1fr 1fr 1fr' : '1fr 1fr';
    skeletonSlots.forEach(slot => {
      const el = document.createElement('div');
      el.className = 'time-slot booked';
      el.style.opacity = '0.3';
      el.style.cursor = 'default';
      el.innerHTML = '<div class="time-main">' + slot + '</div><div class="time-sub">Checking…</div>';
      grid.appendChild(el);
    });

    await fetchTakenSlots(dateStr);
    renderTimeSlots();
    updateBtn();
  }

  function renderTimeSlots() {
    const grid = document.getElementById('timeGrid');
    grid.innerHTML = '';
    const activeSlots = isConsult && selectedDate ? getConsultSlots(selectedDate) : SLOTS;
    grid.style.gridTemplateColumns = activeSlots.length === 3 ? '1fr 1fr 1fr' : '1fr 1fr';
    if (!selectedDate) {
      activeSlots.forEach(slot => {
        const el = document.createElement('div');
        el.className = 'time-slot booked';
        el.style.opacity = '0.3';
        el.style.cursor = 'default';
        el.innerHTML = '<div class="time-main">' + slot + '</div><div class="time-sub">—</div>';
        grid.appendChild(el);
      });
      return;
    }
    activeSlots.forEach(slot => {
      const taken = takenSlots.has(slot);
      const el = document.createElement('div');
      el.dataset.slot = slot;
      el.className = 'time-slot' + (taken ? ' booked' : '') + (!taken && selectedTime === slot ? ' selected' : '');
      const dur = isConsult ? consultDuration : '~3 hrs';
      el.innerHTML = '<div class="time-main">' + slot + '</div><div class="time-sub">' + (taken ? 'Unavailable' : dur) + '</div>';
      if (!taken) el.onclick = () => selectTime(slot);
      grid.appendChild(el);
    });
  }

  function selectTime(slot) {
    const firstPick = !selectedTime;
    selectedTime = slot;
    document.querySelectorAll('#timeGrid .time-slot').forEach(el => el.classList.remove('selected'));
    const el = document.querySelector('#timeGrid [data-slot="' + slot + '"]');
    if (el) el.classList.add('selected');
    document.getElementById('summaryDate').textContent = MONTHS[currentMonth] + ' ' + parseInt(selectedDate.split('-')[2]) + ', ' + currentYear;
    document.getElementById('summaryTime').textContent = slot;
    updateBtn();
    if (firstPick) setTimeout(function() {
      var target = document.getElementById('timeSection');
      if (!target) return;
      var nav = document.querySelector('.top-nav');
      var navH = nav ? nav.getBoundingClientRect().height : 40;
      var top = target.getBoundingClientRect().top + window.pageYOffset - navH + 4;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }, 100);
  }

  function updateBtn() {
    document.getElementById('bookBtn').disabled = !(selectedDate && selectedTime);
  }

  async function prevMonth() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    await renderCalendar();
  }

  async function nextMonth() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    await renderCalendar();
  }

  renderCalendar();
  renderTimeSlots();

  function initAutocomplete() {
    const input = document.getElementById('infoAddress');
    if (!input || !window.google) return;
    const autocomplete = new google.maps.places.Autocomplete(input, {
      types: ['address'],
      fields: ['formatted_address']
    });
    autocomplete.addListener('place_changed', function() {
      const place = autocomplete.getPlace();
      if (place.formatted_address) input.value = place.formatted_address;
    });
  }
  function gm_authFailure() {
    const input = document.getElementById('infoAddress');
    if (input) input.autocomplete = 'street-address';
  }

  // Populate summary from URL params
  const _urlParams = new URLSearchParams(window.location.search);
  (function() {
    const pkgName  = _urlParams.get('pkg') || '';
    const residentialPkgs = ['lemur','gorilla','silverback','silverback supreme','silverback storm'];
    if (residentialPkgs.some(function(p){ return pkgName.toLowerCase().includes(p); })) {
      document.querySelector('.header-bg').style.display = 'block';
    } else {
      document.querySelector('.header-bg').style.display = 'none';
    }
    const pkgTotal = _urlParams.get('total') || _urlParams.get('price') || '';
    const addons   = _urlParams.get('addons') || '';

    if (pkgName)  { document.getElementById('summaryPkgName').textContent = pkgName; document.getElementById('pillPkgName').textContent = pkgName; }
    if (pkgTotal) { document.getElementById('summaryPkgTotal').textContent = '$' + pkgTotal; document.getElementById('pillPkgPrice').textContent = '$' + pkgTotal; }

    if (addons) {
      const list = document.getElementById('summaryAddonsList');
      addons.split(',').forEach(function(a) {
        const parts = a.split(':');
        const label = parts[0] || '';
        const val   = parts[1] || '';
        const row = document.createElement('div');
        row.className = 'summary-row';
        row.innerHTML = '<span class="label">' + label + '</span><span class="value">' + val + '</span>';
        list.appendChild(row);
      });
    }
  })();

  document.getElementById('bookBtn').addEventListener('click', async function() {
    const btn = this;
    const firstName = (document.getElementById('infoFirstName').value || '').trim();
    const lastName  = (document.getElementById('infoLastName').value  || '').trim();
    const phone     = (document.getElementById('infoPhone').value     || '').trim();
    const email     = (document.getElementById('infoEmail').value     || '').trim();
    const address   = (document.getElementById('infoAddress').value   || '').trim();
    const notes     = (document.getElementById('infoNotes').value     || '').trim();
    const date      = document.getElementById('summaryDate').textContent;
    const time      = document.getElementById('summaryTime').textContent;
    const pkgName   = document.getElementById('summaryPkgName').textContent;
    const pkgTotal  = document.getElementById('summaryPkgTotal').textContent;

    const wizard  = _urlParams.get('wizard')  || '';
    const shared  = _urlParams.get('shared')  || '';
    const addons  = _urlParams.get('addons')  || '';

    if (!firstName || !lastName || !phone || !email) {
      alert('Please fill in your name, phone, and email before confirming.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Booking…';

    const booking = {
      first_name:   firstName,
      last_name:    lastName,
      email:        email,
      phone:        phone,
      address:      address,
      package:      pkgName,
      total:        pkgTotal,
      date:         date,
      date_iso:     selectedDate,
      time:         time,
      add_ons:      addons ? addons.replace(/,/g, ' | ') : null,
      notes:        notes  || null,
      monkey_bonus: shared === 'yes' ? 'Referral discount applied (-$25)' : null
    };

    function showSuccess() {
      btn.style.display = 'none';
      document.getElementById('infoSection').querySelectorAll('.info-card, .summary-card, .section-label').forEach(function(el) { el.style.display = 'none'; });
      const success = document.getElementById('bookSuccess');
      success.style.display = 'block';
      success.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/bookings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(booking)
      });
      if (res.ok || res.status === 201) {
        showSuccess();
      } else {
        const err = await res.json().catch(() => ({}));
        console.error('Booking error:', err);
        btn.disabled = false;
        btn.textContent = 'Confirm Booking';
        alert('Something went wrong. Please try again or call us directly.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Confirm Booking';
      alert('Connection error. Please check your internet and try again.');
    }
  });

  document.getElementById('infoPhone').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '').substring(0, 10);
    if (v.length >= 7) v = '(' + v.substring(0,3) + ') ' + v.substring(3,6) + '-' + v.substring(6);
    else if (v.length >= 4) v = '(' + v.substring(0,3) + ') ' + v.substring(3);
    else if (v.length >= 1) v = '(' + v;
    e.target.value = v;
  });

  function syncHero() {
    var nav = document.querySelector('.top-nav');
    var hdr = document.querySelector('.header');
    var spacer = document.getElementById('heroSpacer');
    if (!nav || !hdr || !spacer) return;
    var navH = nav.getBoundingClientRect().height;
    hdr.style.top = navH + 'px';
    spacer.style.height = (navH + hdr.getBoundingClientRect().height) + 'px';
  }
  document.fonts.ready.then(syncHero);
  window.addEventListener('load', syncHero);
  window.addEventListener('resize', syncHero);

</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrEnJzvM5RCL_Y_TOymjadeQdmgB1swI8&libraries=places&callback=initAutocomplete" async defer></script>
</body>
</html>
